app {
  http {
    host = "0.0.0.0"
    port = 8081
    timeout = 40 seconds
  }
  
  one-frame {
    uri = "http://localhost:8080"
    token = ${ONE_FRAME_TOKEN}
    quota {
      max-calls-per-day = 1000
      max-rate-age-seconds = 300  # 5 minutes - max age before rate is considered stale
      refresh-check-interval = 60 seconds  # How often to check if quota needs refresh
    }
  }
  
  redis {
    host = "localhost"
    port = 6379
    timeout = 30 seconds
    ttl = 120 seconds          # TTL for rate data (2 minutes)
    lock-ttl = 30 seconds      # Lock TTL to prevent deadlocks
    lock-retry-delay = 100 milliseconds  # Delay between lock retry attempts
  }
  
  scheduler {
    health-check-interval = 30 seconds  # Redis health check frequency
    backoff {
      min-backoff-seconds = 1
      max-backoff-seconds = 30
      multiplier = 2
      initial-backoff-seconds = 1
    }
  }
  
  system {
    retry-delay = 10 seconds    # Delay before retrying failed operations
  }
}

